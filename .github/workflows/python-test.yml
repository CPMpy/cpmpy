name: Github Tests
on: [push] # Can also put pull_request here, but then we dont run it when directly pushing to master
jobs:
  test:
    strategy:
      fail-fast: true # cancel all jobs as soon as one solver test suite fails
      matrix:
        include:
          - solver: ortools
          - solver: z3
          - solver: pysat
            install_commands: |
              pip install pypblib
              git clone --depth 1 https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
              make -C /tmp/drat-trim drat-trim
              sudo cp /tmp/drat-trim/drat-trim /usr/local/bin/
          - solver: choco
          - solver: exact
          - solver: gcs
            install_commands: |
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              source "$HOME/.cargo/env"
              git clone --depth 1 https://gitlab.com/MIAOresearch/software/VeriPB.git /tmp/VeriPB
              cargo install --locked --path /tmp/VeriPB
              sudo cp "$HOME/.cargo/bin/veripb" /usr/local/bin/
          - solver: minizinc
            install_commands: |
              sudo snap install minizinc --classic
          - solver: pindakaas
          - solver: pumpkin
          - solver: scip
          - solver: highs
    uses: ./.github/workflows/test-solver.yml
    with:
      solver: ${{ matrix.solver }}
      install_commands: ${{ matrix.install_commands || '' }}
